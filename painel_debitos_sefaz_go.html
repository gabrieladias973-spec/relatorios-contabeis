<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A1B42">
<title>Débitos SEFAZ-GO — Mapeamento Consolidado</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --white:#FFFFFF; --off:#F5F7FB;
  --b900:#0A1B42; --b800:#102D6E; --b700:#1A46A8; --b600:#2259CC; --b500:#3B72E8;
  --b400:#6A9AF5; --b200:#BDD0FA; --b100:#E6EDFD; --b50:#F3F7FF;
  --r700:#B91C1C; --r600:#DC2626; --r500:#EF4444; --r200:#FECACA; --r100:#FEF2F2;
  --g600:#16A34A; --g100:#DCFCE7;
  --gray7:#374151; --gray5:#6B7280; --gray3:#D1D5DB; --gray2:#E5E7EB; --gray1:#F3F4F6;
  --amber:#D97706; --amber-bg:#FEF3C7;
  --sombra:rgba(10,31,92,.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--off);color:var(--b900);min-height:100dvh;display:flex;flex-direction:column;}

/* HEADER */
.hdr{background:var(--b900);padding:22px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--r600);position:sticky;top:0;z-index:200;gap:16px;flex-wrap:wrap;}
.hdr-brand h1{font-family:'DM Serif Display',serif;font-size:20px;color:#fff;letter-spacing:.3px;}
.hdr-brand p{font-size:10px;color:var(--b400);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.ybadge{padding:5px 14px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:1px;background:var(--b600);color:#fff;}
.btn-pdf{background:transparent;border:1px solid var(--b400);color:var(--b400);border-radius:6px;padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-pdf:hover{background:var(--b400);color:var(--b900);}

/* NAV */
.nav{background:var(--b800);padding:0 40px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;position:sticky;top:73px;z-index:190;}
.nav::-webkit-scrollbar{display:none;}
.tab{padding:13px 22px;font-size:12px;font-weight:600;color:var(--b400);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;}
.tab.active{color:#fff;border-bottom-color:var(--r500);}
.tab:hover:not(.active){color:var(--b200);}

/* PANELS */
.panel{display:none;padding:32px 40px;max-width:1500px;margin:0 auto;animation:fadeIn .25s ease;}
.panel.active{display:block;flex:1 0 auto;width:100%;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* HEAD DA EMPRESA */
.co-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--gray3);gap:16px;flex-wrap:wrap;}
.co-name{font-family:'DM Serif Display',serif;font-size:26px;color:var(--b900);line-height:1.2;}
.co-cnpj{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gray5);margin-top:5px;}
.co-sector{display:inline-block;background:var(--b100);color:var(--b700);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;padding:3px 10px;border-radius:3px;margin-top:8px;margin-right:6px;}
.co-sector.warn{background:var(--amber-bg);color:var(--amber);}
.co-period{text-align:right;}
.co-period span{display:block;font-size:10px;color:var(--gray5);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.co-period strong{font-family:'DM Serif Display',serif;font-size:16px;color:var(--b800);}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.kpi{background:#fff;border-radius:10px;padding:20px 22px;border:1px solid var(--gray3);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(10,27,66,.1);}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.kpi.ck::before{background:var(--b600);}
.kpi.rk::before{background:var(--r600);}
.kpi.gk::before{background:var(--g600);}
.kpi.dk::before{background:var(--b900);}
.kpi.ak::before{background:var(--amber);}
.kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gray5);margin-bottom:8px;}
.kpi-v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;color:var(--b900);line-height:1;}
.kpi-v2{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gray5);margin-top:6px;}

/* SEC TITLES E GRIDS */
.sec{font-family:'DM Serif Display',serif;font-size:15px;color:var(--b900);margin-bottom:14px;padding-bottom:7px;border-bottom:2px solid var(--b100);display:flex;align-items:center;gap:8px;}
.sec::before{content:'';width:4px;height:16px;background:var(--b600);border-radius:2px;flex-shrink:0;}
.sec small{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;color:var(--gray5);text-transform:uppercase;letter-spacing:1px;margin-left:auto;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.full{margin-bottom:24px;}

/* CARD ANTIGO x NOVO */
.age-card{background:#fff;border-radius:10px;border:1px solid var(--gray3);padding:22px 24px;position:relative;overflow:hidden;}
.age-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:5px;}
.age-card.old::before{background:var(--r600);}
.age-card.new::before{background:var(--b600);}
.age-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;}
.age-card.old .age-tag{color:var(--r600);}
.age-card.new .age-tag{color:var(--b600);}
.age-sub{font-size:11px;color:var(--gray5);margin-bottom:14px;}
.age-main{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;color:var(--b900);}
.age-main small{font-size:11px;color:var(--gray5);font-weight:400;display:block;margin-top:2px;}
.age-rows{margin-top:14px;border-top:1px solid var(--gray1);padding-top:10px;}
.age-row{display:flex;justify-content:space-between;padding:4px 0;font-size:11px;color:var(--gray7);}
.age-row b{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--b900);}
.age-pct{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--gray1);color:var(--gray7);vertical-align:middle;}

/* CARDS DE PARCELAMENTO */
.parc-card{background:#fff;border-radius:10px;border:1px solid var(--gray3);padding:18px 20px;position:relative;overflow:hidden;}
.parc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.parc-card.ok::before{background:var(--g600);}
.parc-card.bad::before{background:var(--r600);}
.parc-card.inc::before{background:var(--amber);}
.parc-card.none::before{background:var(--b900);}
.parc-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;display:inline-block;padding:3px 8px;border-radius:4px;}
.parc-card.ok .parc-tag{background:var(--g100);color:var(--g600);}
.parc-card.bad .parc-tag{background:var(--r100);color:var(--r600);}
.parc-card.inc .parc-tag{background:var(--amber-bg);color:var(--amber);}
.parc-card.none .parc-tag{background:var(--b100);color:var(--b800);}
.parc-n{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;color:var(--b900);}
.parc-n small{font-size:10px;color:var(--gray5);font-weight:400;}
.parc-vals{margin-top:10px;border-top:1px solid var(--gray1);padding-top:8px;}
.parc-vr{display:flex;justify-content:space-between;font-size:10px;color:var(--gray5);padding:3px 0;}
.parc-vr b{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--b900);font-weight:600;}

/* TABLE CARD */
.tc{background:#fff;border-radius:10px;border:1px solid var(--gray3);overflow-x:auto;}
.tc-hdr{background:var(--b900);padding:12px 18px;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.tc-hdr .hint{font-size:9px;color:var(--b400);letter-spacing:.5px;text-transform:none;font-weight:400;}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--b100);}
thead th{padding:8px 14px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--b700);text-align:right;white-space:nowrap;}
thead th:first-child{text-align:left;}
tbody tr{border-bottom:1px solid var(--gray1);transition:background .12s;}
tbody tr:hover{background:var(--off);}
tbody tr:last-child{border-bottom:none;}
td{padding:9px 14px;font-size:12px;text-align:right;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
td:first-child{text-align:left;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--gray7);white-space:normal;}
tr.tot td{font-weight:700;background:var(--b100);color:var(--b800);border-top:2px solid var(--b200);}
.pos{color:var(--g600)!important;font-weight:700;}
.neg{color:var(--r600)!important;font-weight:700;}
.bar-wrap{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.bar{height:8px;border-radius:4px;background:var(--b500);min-width:2px;}
.bar.red{background:var(--r500);}

/* PAGAMENTOS MENSAIS DOS PARCELAMENTOS */
.pay-chart{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:12px;align-items:end;min-height:250px;padding:24px 22px 18px;background:#fff;border:1px solid var(--gray3);border-radius:10px;margin-bottom:24px;overflow-x:auto;}
.pay-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:82px;height:205px;gap:7px;}
.pay-value{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:var(--b800);white-space:nowrap;}
.pay-bar{width:min(54px,70%);background:linear-gradient(180deg,var(--b500),var(--b800));border-radius:6px 6px 2px 2px;min-height:4px;box-shadow:0 4px 10px rgba(34,89,204,.2);}
.pay-month{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--gray5);letter-spacing:.7px;}
.pay-note{font-size:10px;color:var(--gray5);line-height:1.5;margin-top:8px;}
.pay-table td:first-child{font-weight:600;color:var(--b800);}
.pay-table .zero{color:var(--gray3);}

/* STATUS PILL DENTRO DE TABELA */
.pill{display:inline-block;font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:4px;white-space:nowrap;}
.pill.ok{background:var(--g100);color:var(--g600);}
.pill.bad{background:var(--r100);color:var(--r600);}
.pill.inc{background:var(--amber-bg);color:var(--amber);}
.pill.none{background:var(--gray1);color:var(--gray5);}
.pill.sol{background:var(--r100);color:var(--r700);border:1px solid var(--r200);}
.pill.fase{background:var(--b100);color:var(--b700);}

/* FILTROS DA TABELA DE PROCESSOS */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.filters select,.filters input{font-family:'DM Sans',sans-serif;font-size:11px;padding:5px 8px;border-radius:5px;border:1px solid var(--b700);background:var(--b800);color:#fff;}
.filters input{min-width:170px;}
.filters input::placeholder{color:var(--b400);}

/* LINHA EXPANSÍVEL */
tr.proc-row{cursor:pointer;}
tr.detail-row{display:none;}
tr.detail-row.open{display:table-row;}
tr.detail-row>td{white-space:normal;text-align:left;font-family:'DM Sans',sans-serif;background:var(--b50);padding:16px 18px;font-size:12px;color:var(--gray7);line-height:1.55;}
.det-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px;}
.det-item{background:#fff;border:1px solid var(--gray2);border-radius:6px;padding:8px 12px;}
.det-item span{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gray5);margin-bottom:3px;}
.det-item b{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--b900);font-weight:600;}
.det-desc{background:#fff;border:1px solid var(--gray2);border-left:3px solid var(--b600);border-radius:6px;padding:10px 14px;}
.det-desc span{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--b700);margin-bottom:4px;}

/* ALERTA SOLIDARIEDADE */
.alert{background:var(--r100);border:1px solid var(--r200);border-left:5px solid var(--r600);border-radius:10px;padding:18px 22px;margin-bottom:24px;}
.alert h4{font-family:'DM Serif Display',serif;font-size:15px;color:var(--r700);margin-bottom:6px;}
.alert p{font-size:12px;color:var(--gray7);line-height:1.55;}
.alert b{font-family:'JetBrains Mono',monospace;}
.note{background:var(--b50);border:1px dashed var(--b200);border-radius:8px;padding:10px 16px;font-size:11px;color:var(--gray5);margin-bottom:24px;line-height:1.5;}
.note b{color:var(--b800);}

footer{text-align:center;font-size:10px;color:var(--gray5);padding:18px;letter-spacing:.5px;}

@media (max-width:1100px){.kpi-row,.four{grid-template-columns:repeat(2,1fr);}.two{grid-template-columns:1fr;}}
@media (max-width:640px){
  .hdr,.nav,.panel{padding-left:16px;padding-right:16px;}
  .kpi-row,.four{grid-template-columns:1fr;}
  .nav{top:auto;position:static;}
  .hdr{position:static;}
  .pay-chart{grid-template-columns:repeat(7,90px);}
}
@media print{
  .nav,.btn-pdf,.filters{display:none!important;}
  .panel{display:block!important;padding:16px;page-break-after:always;}
  .hdr{position:static;}
  body{background:#fff;}
  .kpi:hover{transform:none;box-shadow:none;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* Remove o cabeçalho duplicado quando este painel é exibido no index.html. */
html.embedded .hdr{display:none;}
html.embedded .nav{top:0;}
</style>
<script>
if (window.self !== window.top) {
  document.documentElement.classList.add('embedded');
}
</script>

/* ====== RENDERIZAÇÃO DO PAINEL ====== */
const fmt = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const fmtN = new Intl.NumberFormat('pt-BR');
function brl(v){ return fmt.format(v || 0); }
function compact(v){
  v = v || 0;
  if (Math.abs(v) >= 1e9) return 'R$ ' + (v/1e9).toLocaleString('pt-BR',{maximumFractionDigits:2}) + ' bi';
  if (Math.abs(v) >= 1e6) return 'R$ ' + (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mi';
  if (Math.abs(v) >= 1e3) return 'R$ ' + (v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0}) + ' mil';
  return brl(v);
}
function pct(part, total){ return total ? (100*part/total).toLocaleString('pt-BR',{maximumFractionDigits:1}) + '%' : '—'; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  ADIMPLENTE:      {cls:'ok',   lbl:'Parcelado — Ativo Adimplente'},

  SEM_PARCELAMENTO:{cls:'none', lbl:'Sem Parcelamento Ativo'},
};

function kpiRow(a){

  return `<div class="kpi-row">

      <div class="kpi-v">${compact(a.semBenef)}</div><div class="kpi-v2">${brl(a.semBenef)}</div></div>
    <div class="kpi ck"><div class="kpi-lbl">Débito total com desconto</div>
      <div class="kpi-v">${compact(a.comDesc)}</div><div class="kpi-v2">${brl(a.comDesc)}</div></div>
    <div class="kpi gk"><div class="kpi-lbl">Economia com benefícios</div>
      <div class="kpi-v">${compact(econ)}</div><div class="kpi-v2">${pct(econ, a.semBenef)} de redução</div></div>
    <div class="kpi dk"><div class="kpi-lbl">Processos</div>
      <div class="kpi-v">${a.n}</div><div class="kpi-v2">autos de infração / CDAs</div></div>
  </div>`;
}

}

function toggleDetail(id){ document.getElementById(id).classList.toggle('open'); }
function filterTable(tid){
  const q = document.getElementById(tid+'-q').value.toLowerCase().trim();
  const parc = document.getElementById(tid+'-parc').value;
  const cat = document.getElementById(tid+'-cat').value;
  document.querySelectorAll('#'+tid+' tbody tr.proc-row').forEach(tr => {
    const ok = (!q || tr.dataset.q.includes(q)) && (!parc || tr.dataset.parc === parc) && (!cat || tr.dataset.cat === cat);
    tr.style.display = ok ? '' : 'none';
    const det = tr.nextElementSibling;
    if (det){ if (!ok){ det.classList.remove('open'); } }
  });
}

function totalPagamento(m){ return m.itens.reduce((s,i) => s+i[2], 0); }

  const tipos = [...new Set(PAGAMENTOS_2026.flatMap(m => m.itens.map(i => i[0])))];
  const totalTipos = tipos.map(tipo => PAGAMENTOS_2026.reduce((s,m) => s + m.itens.filter(i => i[0]===tipo).reduce((a,i) => a+i[2],0),0));

/* ---- painel de EMPRESA ---- */
function renderEmpresa(e){
  const a = e.agg;
  const isCO = e.id === 'co';
  const ies = [...new Set(e.rows.map(r => r.ie))];
  let html = `
  <div class="co-head">
    <div><div class="co-name">${e.nome}</div>
      <div class="co-cnpj">CNPJ raiz ${e.cnpj} · ${ies.length} inscriç${ies.length>1?'ões estaduais':'ão estadual'}</div>
      <span class="co-sector">SEFAZ-GO</span>${isCO ? '<span class="co-sector warn">Devedora solidária / sucessora</span>' : ''}</div>
    <div class="co-period"><span>Débito total (sem benefício)</span><strong>${brl(a.semBenef)}</strong></div>
  </div>
  ${kpiRow(a)}`;

  if (isCO){
    const ap = e.aggProprios, as = e.aggSolid;
    html += `<div class="alert">
      <h4>⚠ Débitos próprios × débitos por solidariedade</h4>
      <p>Do total acima, <b>${brl(as.semBenef)}</b> (${as.n} processos) estão no extrato da Centro Oeste por <b>solidariedade/sucessão</b> —
      a IE devedora original pertence a outra empresa do grupo. Débitos próprios (IEs da própria Centro Oeste): <b>${brl(ap.semBenef)}</b> em ${ap.n} processos.
      No consolidado do grupo, os solidários são contados apenas na empresa de origem.</p>
    </div>
    <div class="two">
      <div class="age-card new"><div class="age-tag" style="color:var(--b600)">Débitos próprios (IEs Centro Oeste)</div>
        <div class="age-sub">${ap.n} processos</div>
        <div class="age-main">${brl(ap.semBenef)}<small>sem benefício</small></div>
        <div class="age-rows"><div class="age-row"><span>Com desconto</span><b>${brl(ap.comDesc)}</b></div></div></div>
      <div class="age-card old"><div class="age-tag">Débitos por solidariedade (IE de outra empresa)</div>
        <div class="age-sub">${as.n} processos — também listados na empresa de origem</div>
        <div class="age-main">${brl(as.semBenef)}<small>sem benefício</small></div>
        <div class="age-rows"><div class="age-row"><span>Com desconto</span><b>${brl(as.comDesc)}</b></div></div></div>
    </div>`;
  }

  html += ageBlock(a, DATA.corte) + parcBlock(a) + catBlock(a) + compBlock(a) + faseBlock(a) + anosBlock(a)
    + procTable(e.rows, e.id, {solidCol: isCO});
  return html;
}

/* ---- montar navegação ---- */
const TABS = [{id:'geral', lbl:'Visão Geral'}, {id:'pagamentos', lbl:'Pagamentos 2026'}].concat(DATA.empresas.map(e => ({id:e.id, lbl:e.id==='co' ? 'Centro Oeste' : 'CNPJ ' + e.cnpj})));
const nav = document.getElementById('nav');
const main = document.getElementById('main');
TABS.forEach((t,i) => {
  const el = document.createElement('div');
  el.className = 'tab' + (i===0 ? ' active':'');
  el.textContent = t.lbl;
  el.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('panel-'+t.id).classList.add('active');
    window.scrollTo({top:0});
  };
  nav.appendChild(el);
  const panel = document.createElement('section');
  panel.className = 'panel' + (i===0 ? ' active':'');
  panel.id = 'panel-' + t.id;
  panel.innerHTML = t.id === 'geral' ? renderGeral() : t.id === 'pagamentos' ? renderPagamentos() : renderEmpresa(DATA.empresas.find(e => e.id === t.id));
  main.appendChild(panel);
});
document.getElementById('ref-date').textContent = 'Extrato · ' + new Date().toLocaleDateString('pt-BR', {month:'short', year:'numeric'}).toUpperCase();
